<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Damian Valencia: AI automation and platform engineering</title>
  <desc id="d">Banner with name, focus areas and a four-step automation pipeline that includes a human review gate.</desc>
  <rect width="1200" height="300" fill="#101b24"/>
  <rect x="1" y="1" width="1198" height="298" fill="none" stroke="#2a4150" stroke-width="2"/>
  <!-- Left column: sized so the text stays readable when GitHub scales the banner to phone width (about 0.33x). -->
  <text x="64" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="80" font-weight="700" fill="#eef4f1">Damian Valencia</text>
  <text x="64" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" fill="#8de5c8">AI automation · platform engineering</text>
  <text x="64" y="228" font-family="Consolas, Menlo, monospace" font-size="36" fill="#b4c7d1">10+ years · SaaS · data · C#</text>
  <!-- Right column: vertical pipeline with the human review gate highlighted. -->
  <g font-family="Consolas, Menlo, monospace" font-size="36">
    <rect x="760" y="40" width="376" height="48" rx="8" fill="#17293a" stroke="#2f4a5f" stroke-width="2"/>
    <text x="784" y="74" fill="#eef4f1">1  ingest</text>
    <rect x="760" y="104" width="376" height="48" rx="8" fill="#17293a" stroke="#2f4a5f" stroke-width="2"/>
    <text x="784" y="138" fill="#eef4f1">2  validate</text>
    <rect x="760" y="168" width="376" height="48" rx="8" fill="#0f2a22" stroke="#8de5c8" stroke-width="3"/>
    <text x="784" y="202" fill="#8de5c8">3  human review</text>
    <rect x="760" y="232" width="376" height="48" rx="8" fill="#17293a" stroke="#2f4a5f" stroke-width="2"/>
    <text x="784" y="266" fill="#eef4f1">4  report</text>
  </g>
  <path d="M948 88v16M948 152v16M948 216v16" stroke="#5d7a8c" stroke-width="3" fill="none"/>
